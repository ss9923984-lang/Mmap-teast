<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مخطط خريطة تكتيكي</title>
    <style>
        body {
            margin: 0;
            background-color: #0b192c; /* لون خلفية تكتيكي شبيه بالبلوبرنت */
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .map-container {
            width: 800px;
            height: 500px;
            border: 2px solid #1e3e62;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px; /* شبكة تخطيط هندسية */
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .zone {
            position: absolute;
            border: 1px dashed #ff6500;
            background: rgba(255, 101, 0, 0.1);
            padding: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }
        .zone:hover {
            background: rgba(255, 101, 0, 0.3);
        }
        #zone-a { top: 50px; left: 100px; width: 150px; height: 100px; }
        #zone-b { top: 200px; left: 350px; width: 200px; height: 120px; }
        #zone-c { top: 80px; left: 600px; width: 120px; height: 200px; }
    </style>
</head>
<body>

    <div class="map-container">
        <!-- مناطق التخطيط -->
        <div id="zone-a" class="zone">منطقة القاعدة (A)</div>
        <div id="zone-b" class="zone">المنطقة الوسطى (B)</div>
        <div id="zone-c" class="zone">منطقة الإمداد (C)</div>
    </div>

</body>
</html>
