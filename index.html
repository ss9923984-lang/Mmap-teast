<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تخطيط خريطة GTA V التفاعلية</title>
    <style>
        body {
            margin: 0;
            background-color: #0b192c;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .toolbar {
            margin: 10px 0;
            background: #1e3e62;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 10;
        }
        button, input[type="color"], input[type="file"] {
            background: #0b192c;
            color: #fff;
            border: 1px solid #00ffee;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #00ffee;
            color: #0b192c;
        }
        .canvas-container {
            position: relative;
            border: 2px solid #00ffee;
            box-shadow: 0 0 20px rgba(0, 255, 238, 0.3);
            cursor: crosshair;
        }
        canvas {
            display: block;
            /* استبدل الرابط أدناه برابط أو مسار صورة خريطة GTA V الخاصة بك */
            background: url('https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1000&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <button id="drawBtn" onclick="setMode('draw')">قلم رسم</button>
        <button id="textBtn" onclick="setMode('text')">إضافة كتابة</button>
        <button id="eraseBtn" onclick="setMode('erase')">ممحاة</button>
        <label>اللون: <input type="color" id="colorPicker" value="#00ffee"></label>
        <button onclick="clearCanvas()">مسح الكل</button>
        <label>إضافة صورة: <input type="file" id="imageLoader" accept="image/*"></label>
    </div>

    <div class="canvas-container">
        <canvas id="mapCanvas" width="900" height="500"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        let mode = 'draw'; // draw, text, erase
        let isDrawing = false;
        
        // ضبط إعدادات القلم
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';

        function setMode(newMode) {
            mode = newMode;
        }

        // الرسم بالفأرة أو اللمس
        canvas.addEventListener('mousedown', (e) => {
            if (mode === 'draw' || mode === 'erase') {
                isDrawing = true;
                ctx.beginPath();
                ctx.moveTo(e.offsetX, e.offsetY);
            } else if (mode === 'text') {
                let text = prompt('أكتب النص الذي تريد إضافته:');
                if (text) {
                    ctx.fillStyle = document.getElementById('colorPicker').value;
                    ctx.font = '18px Arial';
                    ctx.fillText(text, e.offsetX, e.offsetY);
                }
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            if (mode === 'draw') {
                ctx.strokeStyle = document.getElementById('colorPicker').value;
                ctx.lineTo(e.offsetX, e.offsetY);
                ctx.stroke();
            } else if (mode === 'erase') {
                ctx.clearRect(e.offsetX - 15, e.offsetY - 15, 30, 30);
            }
        });

        window.addEventListener('mouseup', () => {
            isDrawing = false;
        });

        // مسح اللوحة كاملة
        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // رفع صور إضافية ووضعها على الخريطة
        document.getElementById('imageLoader').addEventListener('change', function(e) {
            let reader = new FileReader();
            reader.onload = function(event) {
                let img = new Image();
                img.onload = function() {
                    // رسم الصورة في منتصف اللوحة كمثال
                    ctx.drawImage(img, 100, 100, 100, 100);
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        });
    </script>

</body>
</html>
