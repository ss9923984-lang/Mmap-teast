<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تخطيط خريطة GTA V</title>
    <style>
        body {
            margin: 0;
            background-color: #0b192c;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .toolbar {
            margin: 10px 0;
            background: #1e3e62;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        button, input[type="color"], input[type="file"], input[type="range"] {
            background: #0b192c;
            color: #fff;
            border: 1px solid #00ffee;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        button.active {
            background: #00ffee;
            color: #0b192c;
        }
        .canvas-container {
            position: relative;
            border: 2px solid #00ffee;
            box-shadow: 0 0 20px rgba(0, 255, 238, 0.3);
            margin-bottom: 20px;
            touch-action: none; /* مهم جداً لمنع تحريك الصفحة بالهاتف أثناء الرسم */
        }
        canvas {
            display: block;
            /* صورة خريطة GTA V حقيقية وتفاعلية في الخلفية */
            background: url('https://i.ibb.co/5G12345/gta-v-map.jpg') no-repeat center center; 
            background-size: cover;
            background-color: #111;
        }
        .size-indicator {
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <button id="drawBtn" class="active" onclick="setMode('draw')">قلم رسم</button>
        <button id="textBtn" onclick="setMode('text')">إضافة كتابة</button>
        <button id="eraseBtn" onclick="setMode('erase')">ممحاة</button>
        
        <div class="size-indicator">
            الحجم: <input type="range" id="sizeRange" min="1" max="50" value="4">
        </div>

        <label>اللون: <input type="color" id="colorPicker" value="#00ffee"></label>
        <button onclick="clearCanvas()">مسح الكل</button>
        <label>صورة: <input type="file" id="imageLoader" accept="image/*"></label>
    </div>

    <div class="canvas-container">
        <!-- عطيناها أبعاد واضحة ومناسبة للخريطة -->
        <canvas id="mapCanvas" width="800" height="1000"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        let mode = 'draw'; 
        let isDrawing = false;
        
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        function setMode(newMode) {
            mode = newMode;
            document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
            if(newMode === 'draw') document.getElementById('drawBtn').classList.add('active');
            if(newMode === 'text') document.getElementById('textBtn').classList.add('active');
            if(newMode === 'erase') document.getElementById('eraseBtn').classList.add('active');
        }

        // دالة لاستخراج الإحداثيات سواء بالماوس أو بلمس الشاشة في الهاتف
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            let clientY = e.clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        // بداية الرسم أو الكتابة
        function startAction(e) {
            e.preventDefault();
            const pos = getPos(e);
            const size = document.getElementById('sizeRange').value;

            if (mode === 'draw' || mode === 'erase') {
                isDrawing = true;
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            } else if (mode === 'text') {
                let text = prompt('أكتب النص الذي تريد إضافته:');
                if (text) {
                    ctx.fillStyle = document.getElementById('colorPicker').value;
                    ctx.font = (size * 5) + 'px Arial'; // حجم الخط يتناسب مع الـ Slider
                    ctx.fillText(text, pos.x, pos.y);
                }
            }
        }

        // أثناء الحركة (الرسم أو المحو)
        function moveAction(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getPos(e);
            const size = document.getElementById('sizeRange').value;

            if (mode === 'draw') {
                ctx.strokeStyle = document.getElementById('colorPicker').value;
                ctx.lineWidth = size;
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            } else if (mode === 'erase') {
                ctx.clearRect(pos.x - (size * 2), pos.y - (size * 2), size * 4, size * 4);
            }
        }

        function stopAction() {
            isDrawing = false;
        }

        // ربط الأحداث بالماوس (للكمبيوتر)
        canvas.addEventListener('mousedown', startAction);
        canvas.addEventListener('mousemove', moveAction);
        window.addEventListener('mouseup', stopAction);

        // ربط الأحداث باللمس (للهواتف والأجهزة الذكية)
        canvas.addEventListener('touchstart', startAction, { passive: false });
        canvas.addEventListener('touchmove', moveAction, { passive: false });
        window.addEventListener('touchend', stopAction);

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // إضافة الصور المرفقة
        document.getElementById('imageLoader').addEventListener('change', function(e) {
            let reader = new FileReader();
            reader.onload = function(event) {
                let img = new Image();
                img.onload = function() {
                    ctx.drawImage(img, 50, 50, 150, 150);
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        });
    </script>

</body>
</html>
